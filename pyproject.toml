[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finvl-mas"
version = "0.1.0"
description = "Structured Visual Reasoning over Chart Geometry for Financial Decision Making"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy",
    "pandas",
    "matplotlib",
    "mplfinance>=0.12.10b0",
    "scipy",
    "scikit-learn",
    "pydantic>=2.0",
    "openai>=1.0",
    "requests",
    "Pillow",
    "ta",
    "pyyaml",
    "jinja2",
    "tqdm",
    "tabulate",
]

[project.optional-dependencies]
gui = ["gradio>=4.0", "plotly>=5.0"]
opsd = [
    "transformers>=5.2,<6",
    "peft>=0.19,<0.20",
    "accelerate>=1.11,<2",
    "safetensors>=0.6,<1",
]
dev = ["pytest", "ruff", "mypy"]
all = [
    "gradio>=4.0",
    "plotly>=5.0",
    "transformers>=5.2,<6",
    "peft>=0.19,<0.20",
    "accelerate>=1.11,<2",
    "safetensors>=0.6,<1",
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
