# FinVL-MAS default experiment configuration

scenario:
  market: "csi300"
  frequency: "daily"
  lookback_window: 60
  decision_type: "long_short_hold"

data:
  provider: "csv"
  data_dir: "data/processed"
  ohlcv_file: "csi300_daily.csv"

chart:
  renderer: "mplfinance"
  chart_type: "candle"
  volume: true
  overlays:
    - type: "sma"
      periods: [5, 20, 60]
    - type: "bollinger"
      period: 20
      std: 2
  image_size: [1024, 768]
  dpi: 150

geometry:
  trendline:
    min_touches: 2
    window: 60
  support_resistance:
    tolerance_pct: 0.02
    min_touches: 2
  candlestick:
    enabled: true
  formations:
    enabled: true
    min_bars: 10

vlm:
  backend: "openai"
  model: "Qwen/Qwen3.5-9B"
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  temperature: 0.1
  max_tokens: 2048
  timeout: 120
  max_retries: 3
  retry_base_delay: 2.0
  routes: []

agents:
  chart_analyst:
    enabled: true
    use_vlm: true
    use_rule_based: true
  pattern_reasoner:
    enabled: true
  event_analyst:
    enabled: true
    stub: true  # No event data for MVP
  risk_controller:
    enabled: true
    max_position_pct: 0.30
    default_stop_loss_pct: 0.08
  decision_pm:
    enabled: true
    integration_mode: "confidence_weighted"

memory:
  d_model: 512
  enable_gated_attention: true
  confidence_threshold: 0.3

evaluation:
  temporal_split:
    train_start: "2019-01-01"
    train_end: "2022-12-31"
    valid_start: "2023-01-01"
    valid_end: "2023-12-31"
    test_start: "2025-01-01"
    test_end: "2025-12-31"
    live_forward_start: "2026-05-01"
  transaction_cost_bps: 15
  slippage_bps: 5
  execution_delay_days: 1
  metrics:
    - sharpe_ratio
    - annualized_return
    - max_drawdown
    - calmar_ratio
    - information_coefficient
    - rank_ic
    - directional_accuracy
    - win_rate

logging:
  level: "INFO"
  log_dir: "outputs/logs"
  save_artifacts: true
  artifact_dir: "outputs/artifacts"

seed: 42

training:
  visual_sft:
    enabled: true
    freeze_text_encoder: true
    freeze_ts_encoder: true
    train_visual_encoder_only: true
    loss_weights:
      direction_ce: 1.0
      alignment_mse: 0.2
      factor_mse: 0.2
    checkpoint_dir: "outputs/checkpoints/visual_sft"
