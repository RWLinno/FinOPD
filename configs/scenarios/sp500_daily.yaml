name: "sp500_daily"
market: "S&P500"
asset_universe: ["SPY"]
frequency: "daily"
lookback_window: 60
chart_types: ["candlestick_volume"]
decision_type: "long_short_hold"
temporal_split:
  train_start: "2000-01-01"
  train_end: "2015-12-31"
  valid_start: "2016-01-01"
  valid_end: "2018-12-31"
  test_start: "2019-01-01"
  test_end: "2023-12-31"
transaction_cost_bps: 15
slippage_bps: 5
execution_delay_days: 1
metrics:
  - sharpe_ratio
  - annualized_return
  - max_drawdown
  - information_coefficient
  - directional_accuracy
